[tool.ruff]
target-version = "py311"
line-length = 120
# Legacy reference scripts and generated artifacts are not part of the app.
extend-exclude = ["versions", "data"]

[tool.ruff.lint]
# pycodestyle errors, pyflakes, import sorting, bugbear, pyupgrade.
select = ["E", "F", "I", "B", "UP"]
# Long lines are mostly inline HTML/CSS in the PDF template; not worth churning.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
# Many runtime deps (crewai, markdown, xhtml2pdf) ship without type stubs.
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
warn_unused_ignores = false
exclude = ["versions/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
